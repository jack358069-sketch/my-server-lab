# 站点日志轮转：每周一次，保留 4 份并压缩
# copytruncate 适用于进程持有文件句柄、不方便重开日志的情况
/opt/1panel/apps/openresty/openresty/www/sites/47.115.150.227/log/*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/opt/1panel/apps/openresty/openresty/log/*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
